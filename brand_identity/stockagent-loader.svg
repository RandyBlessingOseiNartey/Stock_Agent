<?xml version="1.0" encoding="UTF-8"?>
<!--
  StockAgent — Loading Animation SVG
  Animation: Sequential Strike (2s loop)

  Usage (HTML):
    <img src="stockagent-loader.svg" width="48" height="48"/>
    — or —
    <svg ...> inline </svg>

  Customisation:
    • Change fill="#FFFFFF" on upper/lower polygons for a different bolt colour.
    • Change fill="#2F6BFF" on the flash layer for a different accent.
    • Change animation-duration on .sa-u / .sa-l / .sa-g / .sa-w to adjust speed.

  Background: transparent — place over any dark surface.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="200" height="200" viewBox="0 0 200 200"
     role="img" aria-label="StockAgent loading">

  <defs>
    <style>
      /* ── Keyframes ────────────────────────────────────────────── */

      /* Upper bar: charges first (sharp 0.12s rise at 14%) */
      @keyframes sa-upper {
        0%,  14% { opacity: .20; }
        20%      { opacity: 1;   }
        55%      { opacity: 1;   }
        67%      { opacity: .20; }
        100%     { opacity: .20; }
      }

      /* Lower bar: strikes second (+0.28 s offset) */
      @keyframes sa-lower {
        0%,  28% { opacity: .20; }
        34%      { opacity: 1;   }
        57%      { opacity: 1;   }
        69%      { opacity: .20; }
        100%     { opacity: .20; }
      }

      /* Electric Blue (#2F6BFF) flash at peak strike — used sparingly */
      @keyframes sa-flash {
        0%,  51% { opacity: 0;   }
        55%      { opacity: .55; }
        63%      { opacity: 0;   }
        100%     { opacity: 0;   }
      }

      /* Subtle 5% scale pulse at moment of full strike */
      @keyframes sa-pulse {
        0%,  50% { transform: scale(1);    }
        55%      { transform: scale(1.05); }
        63%      { transform: scale(1);    }
        100%     { transform: scale(1);    }
      }

      /* ── Element rules ───────────────────────────────────────── */
      .sa-u {
        animation: sa-upper 2s linear infinite;
      }
      .sa-l {
        animation: sa-lower 2s linear infinite;
      }
      .sa-g {
        animation: sa-flash 2s linear infinite;
      }
      .sa-w {
        animation: sa-pulse 2s linear infinite;
        /* Scale from bolt centre (100,100) in the 200×200 SVG */
        transform-origin: 100px 100px;
      }
    </style>
  </defs>

  <!-- Wrapper: receives the scale pulse, centred on bolt -->
  <g class="sa-w">

    <!--
      Nested SVG: tight viewBox maps bolt content (9,8)→(47,76)
      to the rectangle (44.12, 0, 111.76, 200), bolt centre = (100,100).
    -->
    <svg x="44.12" y="0" width="111.76" height="200" viewBox="9 8 38 68">

      <!-- Upper parallelogram bar — charges first -->
      <polygon class="sa-u"
               points="47,8 21,8 9,42 21,42 35,42"
               fill="#FFFFFF"/>

      <!-- Lower parallelogram bar — strikes second -->
      <polygon class="sa-l"
               points="35,42 21,42 9,76 35,76 47,42"
               fill="#FFFFFF"/>

      <!-- Electric Blue flash layer (full bolt, brief overlay) -->
      <polygon class="sa-g"
               points="47,8 21,8 9,42 21,42 9,76 35,76 47,42 35,42"
               fill="#2F6BFF"/>

    </svg>
  </g>

</svg>